[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gitgraph"
version = "0.1.0"
description = "Read a local .git directory directly and render an interactive DAG of all commits, branches and tags."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
gitgraph = "gitgraph.cli:main"

[tool.setuptools]
packages = ["gitgraph"]
